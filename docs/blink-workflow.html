<!DOCTYPE html>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--rule:rgba(45,49,66,.12);--label-rule:rgba(45,49,66,.20);--lane:rgba(45,49,66,.018);--node:#fff;--node-stroke:rgba(45,49,66,.25);--chip:rgba(45,49,66,.12);--custom:#b85450;--db:#5e7a9b;--ls:#7c8f6f;--fl:#9c6b50;--wb:#6e6479;--sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}

<body>

    <p class="eyebrow">Process · LangGraph 1.0 · Human-in-the-Loop</p>
    <h1>Blink — Human-in-the-Loop Content Workflow</h1>
